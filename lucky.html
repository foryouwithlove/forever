<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Lucky ❤️</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#ede0e0;
    color:#4b2633;
    font-family:Georgia,"Times New Roman",serif;
    overflow-x:hidden;
}

/* PAGE */
.page{
    width:100%;
    max-width:1000px;
    margin:auto;
    padding:45px 20px 70px;
}

/* TITLE */
.title{
    text-align:center;
    margin-bottom:35px;
}

.title h1{
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(38px,8vw,65px);
    font-weight:400;
    color:#6e1f3a;
    letter-spacing:2px;
}

.title p{
    margin-top:12px;
    font-size:clamp(17px,4vw,22px);
    line-height:1.6;
    color:#704452;
}

/* IMAGE CONTAINER */
.lucky-gallery{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
}

/* EACH IMAGE */
.lucky-gallery img{
    display:block;
    width:min(760px,92%);
    height:auto;
    border-radius:18px;
    box-shadow:0 10px 28px rgba(80,35,45,.12);
}

/* SMALLER MOBILE IMAGES */
@media(max-width:600px){

    .page{
        padding:32px 12px 55px;
    }

    .title{
        margin-bottom:28px;
    }

    .lucky-gallery{
        gap:22px;
    }

    .lucky-gallery img{
        width:94%;
        border-radius:14px;
        box-shadow:0 7px 20px rgba(80,35,45,.11);
    }
}

/* FOOTER */
footer{
    margin-top:55px;
    text-align:center;
    color:#6e1f3a;
    font-size:18px;
    line-height:1.6;
}
</style>
</head>

<body>

    <div class="lucky-gallery">
