<style>

html{

body{
margin:0;

.page{
width:100%;

.title{
text-align:center;

font-weight:600;

}

.subtitle{
text-align:center;
margin:-12px auto 25px;
font-size:15px;
font-style:italic;
color:#8b5364;
}

.gallery{
display:flex;
flex-direction:column;
align-items:center;
gap:16px;
}

/* IMAGES */
.eye-image{
display:block;
width:min(650px,100%);
height:auto;
object-fit:contain;
border-radius:0;
box-shadow:0 8px 25px rgba(110,31,58,.12);
opacity:0;
transform:translateY(20px);
animation:appear .7s ease forwards;
}

/* GIPHY */
.gif-box{
width:min(650px,100%);
margin:0 auto;
display:flex;
justify-content:center;
overflow:hidden;
background:transparent;
}

.gif-box iframe{
display:block;
width:100%;
aspect-ratio:480 / 314;
height:auto;
border:0;
background:transparent;
}

/* TENOR */
.tenor-box{
width:min(650px,100%);
margin:0 auto;
background:transparent!important;
overflow:hidden;
}

.tenor-gif-embed{
width:100%!important;
margin:0!important;
background:transparent!important;
}

/* SPOTIFY */
.spotify-player{
width:100%;
display:flex;
justify-content:center;
margin:0 auto;
}

.spotify-player iframe{
display:block;
width:min(350px,92%);
height:152px;
border:0;
border-radius:12px;
}

/* FINAL DIVIDER */
.finish{
width:min(700px,90%);
margin:38px auto 0;
display:flex;
align-items:center;
gap:14px;
}

.finish::before,
.finish::after{
content:"";
height:1px;
flex:1;
background:#d99aaa;
}

.finish-heart{
color:#b94b68;
font-size:18px;
line-height:1;
}

@keyframes appear{
to{
opacity:1;
transform:translateY(0);
}
}

@media(max-width:600px){

.page{
padding:20px 12px 35px;
}

.title{
font-size:34px;
margin-bottom:20px;
}

.subtitle{
font-size:14px;
margin-bottom:20px;
}

.gallery{
gap:12px;
}

.eye-image{
width:100%;
border-radius:0;
box-shadow:0 5px 16px rgba(110,31,58,.10);
}

.gif-box{
width:100%;
border-radius:0;
}

.tenor-box{
width:100%;
}

.spotify-player iframe{
width:min(350px,92%);
height:152px;
}

.finish{
margin-top:30px;
width:88%;
}

<script>
document.addEventListener("DOMContentLoaded",()=>{

const images=document.querySelectorAll(".eye-image");

const observer=new IntersectionObserver((entries)=>{
entries.forEach(entry=>{
if(entry.isIntersecting){
entry.target.style.animationDelay="0s";
entry.target.style.opacity="1";
entry.target.style.transform="translateY(0)";
observer.unobserve(entry.target);
}
});
},{threshold:.08});

images.forEach(image=>observer.observe(image));

});
</script>
