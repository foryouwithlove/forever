<style>
/* ==================================================
   ✏️ CHANGE THESE SETTINGS
   ================================================== */

:root{
--background:#fff4f7;          /* Background colour */

--image-width:100%;            /* Image width */
--image-gap:20px;              /* Gap between images */

--page-width:900px;            /* Maximum page width */
--page-padding:40px 0;         /* Top & bottom page spacing */

--gif-width:600px;             /* GIF width */
--gif-gap:15px;                /* Space around GIF */

--mobile-image-width:92%;      /* Image width on phone */
--mobile-image-gap:12px;       /* Image gap on phone */

--mobile-page-padding:20px 0;  /* Page spacing on phone */

--mobile-gif-width:92%;        /* GIF width on phone */
--mobile-gif-gap:12px;         /* GIF spacing on phone */
}


/* ==================================================
   MAIN CSS
   ================================================== */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
background:var(--background);
font-family:Arial,sans-serif;
overflow-x:hidden;
}

.story-container{
width:min(var(--page-width),92%);
margin:0 auto;
padding:var(--page-padding);
display:flex;
flex-direction:column;
align-items:center;
gap:var(--image-gap);
}

.story-image{
width:var(--image-width);
height:auto;
display:block;
object-fit:contain;
}

.gif-container{
width:min(var(--gif-width),92%);
margin:var(--gif-gap) auto;
}


/* ==================================================
   📱 MOBILE
   ================================================== */

@media(max-width:600px){

.story-container{
width:100%;
padding:var(--mobile-page-padding);
gap:var(--mobile-image-gap);
}

.story-image{
width:var(--mobile-image-width);
height:auto;
display:block;
}

.gif-container{
width:var(--mobile-gif-width);
margin:var(--mobile-gif-gap) auto;
}

}
</style>
</head>
