<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Your Nose❤️</title>

<style>
*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
margin:0;
padding:0;
background:#f3f8ff;
color:#4b2633;
font-family:Georgia,"Times New Roman",serif;
overflow-x:hidden;
}

.page{
width:100%;
max-width:900px;
margin:0 auto;
padding:28px 18px 45px;
}

.gallery{
display:flex;
flex-direction:column;
align-items:center;
gap:0;
}

/* =================================================
   SPACING CONTROL
   Change ONLY these numbers to adjust spaces.
   ================================================= */

/* IMAGES */
.nose1{margin-bottom:25px}
.nose2{margin-bottom:15px}
.nose3{margin-bottom:15px}
.nose4{margin-bottom:10px}
.nose5{margin-bottom:18px}
.nose6{margin-bottom:15px}
.nose7{margin-bottom:13px}
.nose8{margin-bottom:25px}

/* GIF */
.gif1{margin-bottom:25px}

/* SPOTIFY */
.spotify1{margin-bottom:0px}

/* IMAGES */
.nose-image{
display:block;
width:min(650px,100%);
height:auto;
object-fit:contain;
border-radius:0;
box-shadow:none;
opacity:0;
transform:translateY(20px);
animation:appear .7s ease forwards;
}

/* GIF */
.gif-box{
width:min(650px,100%);
margin:0 auto;
display:flex;
justify-content:center;
overflow:hidden;
background:transparent;
}
.gif-box img{
display:block;
width:100%;
height:auto;
border:0;
}
   
/* SPOTIFY */
.spotify-player{
width:100%;
display:flex;
justify-content:center;
margin-left:auto;
margin-right:auto;
}

.spotify-player iframe{
display:block;
width:min(350px,92%);
height:152px;
border:0;
border-radius:12px;
}

/* FINAL BREAKER */
.finish{
width:400px;
max-width:70%;
height:1px;
margin:80px auto 0;
background:#d7eaff;
position:relative;
}

.finish-heart{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
background:#f3f8ff;
padding:0 10px;
color:#d7eaff;
font-size:18px;
line-height:1;
}

/* ANIMATION */
@keyframes appear{
to{
opacity:1;
transform:translateY(0);
}
}

/* MOBILE */
@media(max-width:600px){

.page{
padding:20px 12px 35px;
}

.nose-image{
width:100%;
}

.gif-box{
width:100%;
}

.spotify-player iframe{
width:min(350px,92%);
height:152px;
}

.finish{
width:250px;
max-width:75%;
margin:35px auto 0;
height:1px;
}

}
</style>
</head>

<body>

<main class="page">

<section class="gallery">

<!-- NOSE 1 -->
<img class="nose-image nose1"
src="../assets/images/nose/nose1.jpg"
alt="Our nose">

<!-- GIF 1 -->
<div class="gif-box gif1">
<img src="../assets/images/nose/nose1.webp" alt="nose">
</div>

<!-- 7 IMAGES -->
<img class="nose-image nose2"
src="../assets/images/nose/nose2.jpg"
alt="Our nose">

<img class="nose-image nose3"
src="../assets/images/nose/nose3.jpg"
alt="Our nose">

<img class="nose-image nose4"
src="../assets/images/nose/nose4.jpg"
alt="Our nose">

<img class="nose-image nose5"
src="../assets/images/nose/nose5.jpg"
alt="Our nose">

<img class="nose-image nose6"
src="../assets/images/nose/nose6.jpg"
alt="Our nose">

<img class="nose-image nose7"
src="../assets/images/nose/nose7.jpg"
alt="Our nose">

<img class="nose-image nose8"
src="../assets/images/nose/nose8.jpg"
alt="Our nose">

<!-- SPOTIFY -->
<div class="spotify-player spotify1">
<iframe
src="https://open.spotify.com/embed/track/2S41NYKvhfm94DbWLjLUmH?utm_source=generator"
allow="autoplay;clipboard-write;encrypted-media;fullscreen;picture-in-picture"
loading="lazy">
</iframe>
</div>

</section>

<!-- FINAL BREAKER -->
<div class="finish">
<span class="finish-heart">♡</span>
</div>

</main>

<script>
document.addEventListener("DOMContentLoaded",()=>{

const images=document.querySelectorAll(".nose-image");

const observer=new IntersectionObserver((entries)=>{
entries.forEach(entry=>{
if(entry.isIntersecting){
entry.target.style.animationDelay="0s";
entry.target.style.opacity="1";
entry.target.style.transform="translateY(0)";
observer.unobserve(entry.target);
}
});
},{threshold:.08});

images.forEach(image=>observer.observe(image));

});
</script>

</body>
</html>
