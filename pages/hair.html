<style>
*{box-sizing:border-box}

body{
margin:0;
background:#eeeeee;

}

.page{
width:min(900px,100%);
margin:auto;

}

.gallery{

.hair-image{
width:min(650px,100%);

transform:translateY(20px);
animation:appear .7s ease forwards;
}

.tenor-wrapper{
width:min(650px,100%);
display:flex;
justify-content:center;
opacity:0;
transform:translateY(20px);
animation:appear .7s ease forwards;
}

.tenor-wrapper .tenor-gif-embed{
width:100%;
}

.spotify-wrapper{
width:min(350px,92%);
height:152px;
margin-left:auto;
margin-right:auto;
border-radius:12px;
overflow:hidden;
opacity:0;
transform:translateY(20px);
animation:appear .7s ease forwards;
}

.spotify-wrapper iframe{
width:100%;
height:152px;
border:0;
}

@keyframes appear{
to{
opacity:1;
transform:translateY(0);
}
}

/* INDIVIDUAL SPACING — CHANGE THESE FREELY */

.hair1{margin-bottom:25px}

/* FINAL DIVIDER */

.finish{

}

<script type="text/javascript" async src="https://tenor.com/embed.js"></script>

<script>
document.addEventListener("DOMContentLoaded",()=>{
const items=document.querySelectorAll(".hair-image,.tenor-wrapper,.spotify-wrapper");

const observer=new IntersectionObserver((entries)=>{
entries.forEach(entry=>{
if(entry.isIntersecting){
entry.target.style.animationDelay="0s";
entry.target.style.opacity="1";
entry.target.style.transform="translateY(0)";
observer.unobserve(entry.target);
}
});
},{threshold:.08});

items.forEach(item=>observer.observe(item));
});
</script>
