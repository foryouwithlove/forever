<!DOCTYPE html>

<title>Your Hips❤️</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#e5f5e9;
font-family:Georgia,"Times New Roman",serif;
color:#aae4ba;
}

.page{
width:min(900px,100%);
margin:auto;
padding:45px 20px;
}

.gallery{
display:flex;
flex-direction:column;
align-items:center;
gap:0;
}

.hips-image{
width:min(650px,100%);
height:auto;
display:block;
border-radius:0;
box-shadow:none;
opacity:0;
transform:translateY(20px);
animation:appear .7s ease forwards;
}

.giphy-wrapper{
width:min(650px,100%);
display:flex;
justify-content:center;
opacity:0;
transform:translateY(20px);
animation:appear .7s ease forwards;
}

.giphy-wrapper iframe{
max-width:100%;
border:0;
display:block;
}

.spotify-wrapper{
width:min(350px,92%);
height:152px;
margin-left:auto;
margin-right:auto;
border-radius:12px;
overflow:hidden;
opacity:0;
transform:translateY(20px);
animation:appear .7s ease forwards;
}

.spotify-wrapper iframe{
width:100%;
height:152px;
border:0;
}

@keyframes appear{
to{
opacity:1;
transform:translateY(0);
}
}

/* INDIVIDUAL SPACING — CHANGE THESE FREELY */

.finish{

<script>
document.addEventListener("DOMContentLoaded",()=>{
const items=document.querySelectorAll(".hips-image,.giphy-wrapper,.spotify-wrapper");

const observer=new IntersectionObserver((entries)=>{
entries.forEach(entry=>{
if(entry.isIntersecting){
entry.target.style.animationDelay="0s";
entry.target.style.opacity="1";
entry.target.style.transform="translateY(0)";
observer.unobserve(entry.target);
}
});
},{threshold:.08});

items.forEach(item=>observer.observe(item));
});
</script>
