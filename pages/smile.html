.spotify5{margin-bottom:0}

/* IMAGES */
.smile-image{
display:block;
width:min(650px,100%);
height:auto;
object-fit:contain;
border-radius:0;
box-shadow:none;
opacity:0;
transform:translateY(20px);
animation:appear .7s ease forwards;
}

/* SPOTIFY */
.spotify-player{
width:100%;
display:flex;
justify-content:center;
margin-left:auto;
margin-right:auto;
}

.spotify-player iframe{
display:block;
width:min(350px,92%);
height:152px;
border:0;
border-radius:12px;
}

/* FINAL BREAKER */
.finish{
width:400px;
max-width:70%;
height:1px;
margin:35px auto 0;
background:#f4d3df;
position:relative;
}

.finish-heart{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
background:#fff7fa;
padding:0 10px;
color:#f4d3df;
font-size:18px;
line-height:1;
}

/* ANIMATION */
@keyframes appear{
to{
opacity:1;
transform:translateY(0);
}
}

/* MOBILE */
@media(max-width:600px){

.page{
padding:20px 12px 35px;
}

.smile-image{
width:100%;
}

.spotify-player iframe{

height:152px;

.finish{
width:250px;

<script>
document.addEventListener("DOMContentLoaded",()=>{

const images=document.querySelectorAll(".smile-image");

const observer=new IntersectionObserver((entries)=>{
entries.forEach(entry=>{
if(entry.isIntersecting){
entry.target.style.animationDelay="0s";
entry.target.style.opacity="1";
entry.target.style.transform="translateY(0)";
observer.unobserve(entry.target);
}
});
},{threshold:.08});

images.forEach(image=>observer.observe(image));

});
</script>
