<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>கதை ❤️</title>
<link rel="stylesheet" href="assets/our-story.css">
</head>
<body>
<main class="story-page">

<!-- INTRO -->
<section class="story-intro">
<h1 id="typewriter-title"></h1>
<p class="intro-text">I don't think either of us knew where this would lead. But somehow, one moment became another, and somewhere along the way, it became us.</p>
</section>

<!-- RELATIONSHIP CLOCK -->
<section class="timer-section reveal">
<div class="timer-card">
<p class="timer-title">A QUICK REMINDER</p>
<div class="main-year">
<span id="years">0</span>
<span>years</span>
</div>
<div class="relationship-time">
<span id="months">0</span> MONTHS
<span class="dot">·</span>
<span id="days">0</span> DAYS
</div>
<div class="live-time">
<span id="hours">00</span><span>:</span><span id="minutes">00</span><span>:</span><span id="seconds">00</span>
</div>
</div>
</section>

<!-- STORY TIME IMAGE -->
<section class="story-image reveal">
<h2 id="story-typewriter"></h2>
<img src="assets/images/story/ready.jpg" alt="Ready">
</section>

<!-- CHAPTER IMAGES -->
<section class="chapters">
<a href="pages/story1.html" class="chapter reveal"><img src="assets/images/story/chapter1.jpg" alt="Chapter 1"></a>
<a href="pages/story2.html" class="chapter reveal"><img src="assets/images/story/chapter2.jpg" alt="Chapter 2"></a>
<a href="pages/story3.html" class="chapter reveal"><img src="assets/images/story/chapter3.jpg" alt="Chapter 3"></a>
<a href="pages/story4.html" class="chapter reveal"><img src="assets/images/story/chapter4.jpg" alt="Chapter 4"></a>
<a href="pages/story5.html" class="chapter reveal"><img src="assets/images/story/chapter5.jpg" alt="Chapter 5"></a>
</section>

<!-- END -->
<section class="end-note reveal">
<img src="assets/images/story/final1.jpg" alt="Us">
<img src="assets/images/story/final2.jpg" alt="Us">
<img src="assets/images/story/final3.jpg" alt="Us">
</section>
</main>
<script src="assets/our-story.js"></script>
</body>
</html>
