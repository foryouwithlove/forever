<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KAVITHAI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--wine:#6e1f3a;--paper:#fffaf4}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:Georgia,"Times New Roman",serif;background:radial-gradient(circle at 20% 10%,rgba(255,255,255,.45),transparent 30%),linear-gradient(145deg,#f8dfe5,#edc3cd 50%,#dba8b6);color:#4b2633}

.back{position:fixed;top:12px;left:12px;z-index:500;padding:6px 11px;border:1px solid rgba(110,31,58,.2);border-radius:30px;background:rgba(255,250,244,.65);color:var(--wine);text-decoration:none;font-size:9px;letter-spacing:1px;backdrop-filter:blur(7px)}
.title{position:fixed;top:15px;left:50%;transform:translateX(-50%);z-index:500;font-size:8px;letter-spacing:5px;color:var(--wine);opacity:.65}

.book-area{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:40px 5px 42px;perspective:1800px}
.book{position:relative;width:min(900px,96vw);height:min(760px,calc(100vh - 85px));transform-style:preserve-3d;filter:drop-shadow(0 16px 30px rgba(70,25,40,.27))}

.paper{position:absolute;inset:0;background:var(--paper);overflow:hidden;border-radius:4px 7px 7px 4px;box-shadow:inset -8px 0 16px rgba(70,25,40,.055),0 2px 10px rgba(70,25,40,.18)}
.paper canvas{display:block;width:100%;height:100%;background:var(--paper)}

.turn{position:absolute;inset:0;z-index:30;display:none;transform-style:preserve-3d;pointer-events:none}
.turn.active{display:block}

.sheet{position:absolute;inset:0;transform-style:preserve-3d;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:var(--paper)}
.sheet.front{transform-origin:left center;border-radius:3px 7px 7px 3px;box-shadow:0 5px 25px rgba(60,20,40,.25)}
.sheet.back{transform-origin:right center;transform:rotateY(180deg);border-radius:7px 3px 3px 7px}

.sheet canvas{display:block;width:100%;height:100%;background:var(--paper)}

.sheet:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;background:linear-gradient(90deg,rgba(255,255,255,.12),transparent 35%,rgba(70,25,40,.08))}
.sheet.back:after{transform:scaleX(-1)}

.turn.next .sheet.front{animation:pageNext .72s cubic-bezier(.42,.02,.18,1) forwards}
.turn.next .sheet.back{animation:pageBackNext .72s cubic-bezier(.42,.02,.18,1) forwards}
.turn.prev .sheet.front{transform-origin:right center;animation:pagePrev .72s cubic-bezier(.42,.02,.18,1) forwards}
.turn.prev .sheet.back{animation:pageBackPrev .72s cubic-bezier(.42,.02,.18,1) forwards}

@keyframes pageNext{
0%{transform:rotateY(0deg) rotateX(0deg) scaleX(1);filter:drop-shadow(0 0 0 rgba(50,15,30,0))}
18%{transform:rotateY(-28deg) rotateX(1deg) scaleX(.97);filter:drop-shadow(12px 3px 12px rgba(50,15,30,.2))}
40%{transform:rotateY(-78deg) rotateX(2deg) scaleX(.92);filter:drop-shadow(22px 4px 18px rgba(50,15,30,.3))}
65%{transform:rotateY(-135deg) rotateX(1deg) scaleX(.95);filter:drop-shadow(12px 3px 15px rgba(50,15,30,.2))}
82%{transform:rotateY(-163deg) scaleX(.985)}
100%{transform:rotateY(-180deg) scaleX(1);filter:drop-shadow(0 0 0 rgba(50,15,30,0))}
}

@keyframes pageBackNext{
0%{transform:rotateY(180deg)}
100%{transform:rotateY(0deg)}
}

@keyframes pagePrev{
0%{transform:rotateY(0deg) rotateX(0deg) scaleX(1);filter:drop-shadow(0 0 0 rgba(50,15,30,0))}
18%{transform:rotateY(28deg) rotateX(1deg) scaleX(.97);filter:drop-shadow(-12px 3px 12px rgba(50,15,30,.2))}
40%{transform:rotateY(78deg) rotateX(2deg) scaleX(.92);filter:drop-shadow(-22px 4px 18px rgba(50,15,30,.3))}
65%{transform:rotateY(135deg) rotateX(1deg) scaleX(.95);filter:drop-shadow(-12px 3px 15px rgba(50,15,30,.2))}
82%{transform:rotateY(163deg) scaleX(.985)}
100%{transform:rotateY(180deg) scaleX(1);filter:drop-shadow(0 0 0 rgba(50,15,30,0))}
}

@keyframes pageBackPrev{
0%{transform:rotateY(-180deg)}
100%{transform:rotateY(0deg)}
}

.spine-shadow{position:absolute;top:0;left:0;width:18px;height:100%;z-index:10;pointer-events:none;background:linear-gradient(90deg,rgba(60,20,40,.12),transparent)}

.controls{position:fixed;bottom:9px;left:50%;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:9px}
.nav-btn{width:33px;height:33px;border:1px solid rgba(110,31,58,.2);border-radius:50%;background:rgba(255,250,244,.72);color:var(--wine);font-size:18px;cursor:pointer;backdrop-filter:blur(6px)}
.nav-btn:disabled{opacity:.25}
.page-count{min-width:42px;text-align:center;font-size:8px;letter-spacing:1px;color:var(--wine)}
.hint{position:fixed;bottom:50px;left:50%;transform:translateX(-50%);z-index:100;font-size:7px;letter-spacing:1.5px;color:var(--wine);opacity:.5;white-space:nowrap;transition:opacity .5s}
.hint.hide{opacity:0}

.loading{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f5d8df;color:var(--wine);transition:opacity .25s}
.loading.hidden{opacity:0;pointer-events:none}
.loader{width:27px;height:27px;border:2px solid rgba(110,31,58,.15);border-top-color:var(--wine);border-radius:50%;animation:spin .55s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:8px;letter-spacing:2.5px}

.error{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;text-align:center;padding:25px;background:#f5d8df;color:var(--wine)}
.error.show{display:flex}
.error h2{font-weight:normal;font-size:24px;margin-bottom:10px}
.error p{font-family:Arial,sans-serif;font-size:12px;line-height:1.6;opacity:.8}

@media(max-width:700px){
.book-area{padding:40px 2px 39px}
.book{width:99vw;height:calc(100vh - 82px);filter:drop-shadow(0 10px 20px rgba(70,25,40,.24))}
.back{top:9px;left:9px;font-size:8px;padding:6px 10px}
.title{top:12px;font-size:7px;letter-spacing:4px}
.controls{bottom:6px}
.nav-btn{width:31px;height:31px;font-size:16px}
.page-count{font-size:7px}
.hint{bottom:43px;font-size:6.5px}
}

@media(max-width:380px){
.book{width:100vw;height:calc(100vh - 78px)}
.book-area{padding-left:0;padding-right:0}
}
</style>
</head>
<body>

<a href="index.html" class="back">← HOME</a>
<div class="title">KAVITHAI</div>

<div class="loading" id="loading">
<div class="loader"></div>
<div class="loading-text">OPENING...</div>
</div>

<div class="error" id="error">
<div>
<h2>Something went wrong ♡</h2>
<p>Please make sure <b>assets/kavithai.pdf</b> exists.</p>
</div>
</div>

<div class="book-area">
<div class="book" id="book">

<div class="paper">
<canvas id="currentCanvas"></canvas>
</div>

<div class="spine-shadow"></div>

<div class="turn" id="turn">
<div class="sheet front">
<canvas id="frontCanvas"></canvas>
</div>
<div class="sheet back">
<canvas id="backCanvas"></canvas>
</div>
</div>

</div>
</div>

<div class="controls">
<button class="nav-btn" id="prevBtn">‹</button>
<div class="page-count" id="pageCount">1 / 1</div>
<button class="nav-btn" id="nextBtn">›</button>
</div>

<div class="hint" id="hint">SWIPE OR TAP THE PAGE</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const PDF_PATH="assets/kavithai.pdf";
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let pdf=null,totalPages=0,currentPage=1,busy=false;
const cache=new Map();

const loading=document.getElementById("loading");
const error=document.getElementById("error");
const book=document.getElementById("book");
const currentCanvas=document.getElementById("currentCanvas");
const frontCanvas=document.getElementById("frontCanvas");
const backCanvas=document.getElementById("backCanvas");
const turn=document.getElementById("turn");
const prevBtn=document.getElementById("prevBtn");
const nextBtn=document.getElementById("nextBtn");
const pageCount=document.getElementById("pageCount");
const hint=document.getElementById("hint");

async function renderPage(n){
if(!n||n<1||n>totalPages)return null;
if(cache.has(n))return cache.get(n);
const page=await pdf.getPage(n);
const box=book.getBoundingClientRect();
const base=page.getViewport({scale:1});
const scale=Math.min(box.width/base.width,box.height/base.height);
const viewport=page.getViewport({scale});
const dpr=Math.min(window.devicePixelRatio||1,2);
const c=document.createElement("canvas");
c.width=Math.ceil(viewport.width*dpr);
c.height=Math.ceil(viewport.height*dpr);
const ctx=c.getContext("2d");
ctx.setTransform(dpr,0,0,dpr,0,0);
await page.render({canvasContext:ctx,viewport}).promise;
cache.set(n,c);
return c;
}

function copyCanvas(source,target){
target.width=source.width;
target.height=source.height;
target.style.width="100%";
target.style.height="100%";
const ctx=target.getContext("2d");
ctx.clearRect(0,0,target.width,target.height);
ctx.drawImage(source,0,0);
}

async function display(n){
const c=await renderPage(n);
if(c)copyCanvas(c,currentCanvas);
pageCount.textContent=n+" / "+totalPages;
prevBtn.disabled=n===1;
nextBtn.disabled=n===totalPages;
}

async function preload(n){
if(n>=1&&n<=totalPages){
try{await renderPage(n)}catch(e){}
}
}

async function nextPage(){
if(busy||currentPage>=totalPages)return;
busy=true;
const old=await renderPage(currentPage);
const next=await renderPage(currentPage+1);
copyCanvas(old,frontCanvas);
copyCanvas(next,backCanvas);
turn.className="turn active next";
await new Promise(r=>setTimeout(r,720));
currentPage++;
turn.className="turn";
copyCanvas(next,currentCanvas);
pageCount.textContent=currentPage+" / "+totalPages;
prevBtn.disabled=false;
nextBtn.disabled=currentPage===totalPages;
busy=false;
hint.classList.add("hide");
preload(currentPage+1);
}

async function prevPage(){
if(busy||currentPage<=1)return;
busy=true;
const old=await renderPage(currentPage);
const previous=await renderPage(currentPage-1);
copyCanvas(old,frontCanvas);
copyCanvas(previous,backCanvas);
turn.className="turn active prev";
await new Promise(r=>setTimeout(r,720));
currentPage--;
turn.className="turn";
copyCanvas(previous,currentCanvas);
pageCount.textContent=currentPage+" / "+totalPages;
prevBtn.disabled=currentPage===1;
nextBtn.disabled=false;
busy=false;
hint.classList.add("hide");
preload(currentPage-1);
}

prevBtn.onclick=prevPage;
nextBtn.onclick=nextPage;

book.addEventListener("click",e=>{
if(busy)return;
const rect=book.getBoundingClientRect();
if(e.clientX-rect.left>rect.width/2)nextPage();
else prevPage();
});

document.addEventListener("keydown",e=>{
if(e.key==="ArrowRight")nextPage();
if(e.key==="ArrowLeft")prevPage();
});

let startX=0;
book.addEventListener("touchstart",e=>{
startX=e.changedTouches[0].screenX;
},{passive:true});

book.addEventListener("touchend",e=>{
const diff=e.changedTouches[0].screenX-startX;
if(Math.abs(diff)>30){
if(diff<0)nextPage();
else prevPage();
}
},{passive:true});

window.addEventListener("resize",()=>{
clearTimeout(window.resizeTimer);
window.resizeTimer=setTimeout(async()=>{
cache.clear();
if(pdf)await display(currentPage);
},150);
});

async function start(){
try{
pdf=await pdfjsLib.getDocument({url:PDF_PATH}).promise;
totalPages=pdf.numPages;
await display(1);
loading.classList.add("hidden");
preload(2);
}catch(e){
console.error(e);
loading.classList.add("hidden");
error.classList.add("show");
}
}

start();
</script>
</body>
</html>
