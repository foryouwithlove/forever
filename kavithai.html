<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>கவிதை ❤️</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%}
body{background:radial-gradient(circle at top,#fff8fa,#ffe9ef 52%,#f8dce4);font-family:Georgia,serif;color:#4b2633;overflow-x:hidden}
.page{min-height:100vh;padding:32px 15px 45px;text-align:center}

.intro-card{
width:min(650px,100%);
margin:0 auto 28px;
padding:27px 25px;
position:relative;
background:rgba(255,252,250,.82);
border:1px solid rgba(110,31,58,.12);
border-radius:24px;
box-shadow:0 14px 38px rgba(100,45,60,.12),inset 0 0 30px rgba(255,255,255,.55);
overflow:hidden
}
.intro-card:before{
content:"";
position:absolute;
top:0;
left:12%;
right:12%;
height:1px;
background:rgba(110,31,58,.16)
}
.intro-card p{
font-size:clamp(16px,3vw,20px);
line-height:1.85;
color:#542536;
letter-spacing:.2px
}
.intro-card span{
color:#9b4d68;
font-style:italic
}

.book-stage{
width:min(380px,82vw);
margin:0 auto;
display:flex;
flex-direction:column;
align-items:center
}

.open-text{
color:#7b4053;
font-size:12px;
letter-spacing:2px;
margin:0 auto 15px;
animation:pulse 2s ease-in-out infinite
}
@keyframes pulse{
0%,100%{opacity:.45}
50%{opacity:1}
}

.cover{
position:relative;
width:100%;
cursor:pointer;
box-shadow:0 18px 45px rgba(100,45,60,.25);
transition:transform .3s ease,box-shadow .3s ease;
transform-style:preserve-3d
}
.cover:hover{
transform:translateY(-4px) rotateY(-2deg);
box-shadow:0 25px 55px rgba(100,45,60,.32)
}
.cover img{
display:block;
width:100%;
height:auto
}
.cover.opening{
animation:coverOpen .65s ease forwards
}
@keyframes coverOpen{
0%{transform:rotateY(0) scale(1);opacity:1}
45%{transform:rotateY(-12deg) scale(1.015);opacity:1}
100%{transform:rotateY(-90deg) scale(.97);opacity:0}
}

/* BOOK BACKGROUND */
.book-view{
display:none;
position:fixed;
inset:0;
z-index:100;
align-items:center;
justify-content:center;
perspective:1800px;
overflow:hidden
}
.book-view:before{
content:"";
position:absolute;
inset:-25px;
background:inherit;
backdrop-filter:blur(10px);
-webkit-backdrop-filter:blur(10px);
z-index:-2
}
.book-view:after{
content:"";
position:absolute;
inset:0;
background:rgba(70,35,48,.18);
z-index:-1
}

.book{
position:relative;
width:min(70vw,650px);
height:min(88vh,920px);
display:flex;
align-items:center;
justify-content:center;
transform-style:preserve-3d;
will-change:transform;
z-index:5
}

.page-img{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden
}
.page-img img{
display:block;
width:100%;
height:100%;
object-fit:contain
}
#current{z-index:2}

#flip{
position:absolute;
inset:0;
z-index:5;
display:none;
transform-style:preserve-3d;
will-change:transform
}
#flip .front,#flip .back{
position:absolute;
inset:0;
backface-visibility:hidden;
overflow:hidden
}
#flip .front{z-index:2}
#flip .back{transform:rotateY(180deg)}
#flip img{
display:block;
width:100%;
height:100%;
object-fit:contain
}

#shadow{
position:absolute;
inset:0;
z-index:8;
pointer-events:none;
background:linear-gradient(90deg,rgba(100,45,60,.2),transparent 45%,rgba(100,45,60,.1));
opacity:0;
will-change:opacity
}

/* ARROWS ONLY WHEN BOOK IS OPEN */
.arrow{
display:none;
position:fixed;
top:50%;
transform:translateY(-50%);
z-index:120;
width:70px;
height:90px;
border:0;
background:rgba(255,255,255,.3);
border-radius:50%;
color:#6e1f3a;
font-family:Georgia,serif;
font-size:62px;
line-height:1;
cursor:pointer;
box-shadow:0 5px 20px rgba(100,45,60,.12);
transition:transform .2s ease,background .2s ease
}
.arrow:hover{
transform:translateY(-50%) scale(1.08);
background:rgba(255,255,255,.55)
}
.arrow:disabled{
opacity:.15;
cursor:default;
pointer-events:none
}
#prev{left:max(12px,calc(50% - 430px))}
#next{right:max(12px,calc(50% - 430px))}
body.book-open .arrow{display:block}

/* LOADING */
.loading{
position:fixed;
inset:0;
background:rgba(255,248,250,.72);
backdrop-filter:blur(9px);
-webkit-backdrop-filter:blur(9px);
z-index:200;
display:none;
align-items:center;
justify-content:center
}
.loader{
width:43px;
height:43px;
border:3px solid rgba(110,31,58,.14);
border-top-color:#9b4d68;
border-radius:50%;
animation:spin .75s linear infinite
}
.lyrics-section{
width:min(700px,100%);
margin:40px auto 0px;
text-align:center;
}

.lyrics-image{
width:95%;
display:block;
border-radius:0;
margin:0 auto 25px;
}

.spotify-player{
width:100%;
display:flex;
justify-content:center;
}

.spotify-player iframe{
display:block;
width:min(350px,92%);
}
@keyframes spin{
to{transform:rotate(360deg)}
}

@media(max-width:900px){
.book{width:min(72vw,600px)}
#prev{left:10px}
#next{right:10px}
}

@media(max-width:600px){
.page{padding:27px 12px 35px}
.intro-card{
padding:22px 18px;
margin-top:0px;
margin-bottom:30px;
border-radius:21px
}
.intro-card p{line-height:1.75}
.book-stage{width:88vw}
.open-text{
font-size:13px;
margin-bottom:18px
}
.book{
width:90vw;
height:88vh
}
.arrow{
width:42px;
height:65px;
font-size:45px;
background:rgba(255,255,255,.38)
}
#prev{left:3px}
#next{right:3px}
}
</style>
</head>

<body>

<div class="lyrics-section">

<img class="lyrics-image"
src="assets/images/kavithai/kavithai101.jpg"
alt="கவிதை">

<div class="spotify-player">
<iframe
data-testid="embed-iframe"
style="border-radius:12px"
src="https://open.spotify.com/embed/track/1zZTvax6SvPuoudxmfZfqV?utm_source=generator&si=3295b4c7673b4943"
width="100%"
height="152"
frameBorder="0"
allowfullscreen=""
allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
loading="lazy">
</iframe>
</div>

</div>

<main class="page">
<div class="intro-card">
<p>Here's something I wrote for you.<br><span>Every Line is dedicated specially to you</span><br>I hope you enjoy it (づᴗ _ᴗ)づ♡</p>
</div>

<div class="book-stage">
<div class="open-text" id="openText">♡ TAP THE COVER TO OPEN ♡</div>

<div class="cover" id="cover">
<img src="assets/images/kavithai/kavithai1.jpg" alt="கவிதை cover">
</div>
</div>

<div class="book-view" id="bookView">
<div class="book">
<div class="page-img" id="current">
<img id="currentImg">
</div>
<div id="flip">
<div class="front"><img id="frontImg"></div>
<div class="back"><img id="backImg"></div>
</div>
<div id="shadow"></div>
</div>
</div>

<button class="arrow" id="prev" aria-label="Previous page">‹</button>
<button class="arrow" id="next" aria-label="Next page">›</button>

<div class="loading" id="loading">
<div class="loader"></div>
</div>

<script>
const totalPages=10;
const imagePath="assets/images/kavithai/";
const cover=document.getElementById("cover");
const openText=document.getElementById("openText");
const bookView=document.getElementById("bookView");
const loading=document.getElementById("loading");
const currentImg=document.getElementById("currentImg");
const frontImg=document.getElementById("frontImg");
const backImg=document.getElementById("backImg");
const flip=document.getElementById("flip");
const shadow=document.getElementById("shadow");
const next=document.getElementById("next");
const prev=document.getElementById("prev");

let currentPage=1;
let animating=false;
let bookOpened=false;

function image(n){
return imagePath+"kavithai"+n+".jpg";
}

function preload(){
for(let i=1;i<=totalPages;i++){
const img=new Image();
img.src=image(i);
}
}

function showPage(n){
currentPage=n;
currentImg.src=image(n);
prev.disabled=n===1;
next.disabled=n===totalPages;
}

function openBook(){
if(animating||bookOpened)return;

animating=true;
bookOpened=true;

history.pushState({bookOpen:true},"","#book");

document.body.classList.add("book-open");
openText.style.opacity="0";
cover.classList.add("opening");
loading.style.display="flex";

preload();

setTimeout(()=>{
bookView.style.display="flex";
showPage(1);

requestAnimationFrame(()=>{
setTimeout(()=>{
loading.style.display="none";
animating=false;
},120);
});
},500);
}

function closeBook(){
if(!bookOpened)return;

animating=false;
bookOpened=false;

bookView.style.display="none";
loading.style.display="none";

document.body.classList.remove("book-open");

cover.classList.remove("opening");
openText.style.opacity="";

showPage(1);
}

window.addEventListener("popstate",()=>{
if(bookOpened){
closeBook();
}
});

function flipPage(direction){
if(animating)return;
if(direction==="next"&&currentPage>=totalPages)return;
if(direction==="prev"&&currentPage<=1)return;

animating=true;

const oldPage=currentPage;
const newPage=direction==="next"?oldPage+1:oldPage-1;

currentImg.src=image(newPage);
frontImg.src=image(oldPage);
backImg.src=image(newPage);

flip.style.display="block";
shadow.style.opacity=".15";

const start=direction==="next"?0:-180;
const middle=direction==="next"?-75:-105;
const end=direction==="next"?-180:0;

flip.style.transformOrigin=direction==="next"?"left center":"right center";
flip.style.transform=`rotateY(${start}deg)`;

const animation=flip.animate(
[
{transform:`rotateY(${start}deg)`},
{transform:`rotateY(${middle}deg)`,offset:.48},
{transform:`rotateY(${end}deg)`}
],
{
duration:650,
easing:"cubic-bezier(.4,0,.2,1)",
fill:"forwards"
}
);

shadow.animate(
[
{opacity:".05"},
{opacity:".30",offset:.48},
{opacity:"0"}
],
{
duration:650,
easing:"ease-out",
fill:"forwards"
}
);

animation.onfinish=()=>{
currentPage=newPage;
showPage(currentPage);
flip.style.display="none";
flip.style.transform="none";
shadow.style.opacity="0";
animating=false;
};
}

cover.addEventListener("click",openBook);

next.addEventListener("click",()=>{
flipPage("next");
});

prev.addEventListener("click",()=>{
flipPage("prev");
});

let startX=0;
let startY=0;

bookView.addEventListener("touchstart",e=>{
startX=e.touches[0].clientX;
startY=e.touches[0].clientY;
},{passive:true});

bookView.addEventListener("touchend",e=>{
const endX=e.changedTouches[0].clientX;
const endY=e.changedTouches[0].clientY;
const dx=endX-startX;
const dy=endY-startY;

if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){
flipPage(dx<0?"next":"prev");
}
},{passive:true});

document.addEventListener("keydown",e=>{
if(!bookOpened)return;

if(e.key==="ArrowRight")flipPage("next");
if(e.key==="ArrowLeft")flipPage("prev");
if(e.key==="Escape")history.back();
});

showPage(1);
</script>

</body>
</html>
