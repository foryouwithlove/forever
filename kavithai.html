<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KAVITHAI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{background:#302b2c;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif}
.book-area{width:100%;height:100%;display:flex;align-items:center;justify-content:center;perspective:2200px;position:relative}
.book{width:min(82vw,650px);height:min(88vh,920px);position:relative;transform-style:preserve-3d}
.page{position:absolute;inset:0;background:#fff;overflow:hidden;transform-style:preserve-3d;box-shadow:0 15px 45px rgba(0,0,0,.45);backface-visibility:hidden}
.page img{width:100%;height:100%;display:block;object-fit:contain;background:#fff}
#current{z-index:2}
#flip{z-index:4;display:none;transform-style:preserve-3d}
#flip .front,#flip .back{position:absolute;inset:0;backface-visibility:hidden}
#flip .back{transform:rotateY(180deg)}
#flip img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.edge-shadow{position:absolute;top:0;bottom:0;width:50%;pointer-events:none;z-index:8;opacity:0}
.flip-shadow{position:absolute;inset:0;pointer-events:none;z-index:9;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,.04) 45%,rgba(255,255,255,.16) 65%,rgba(0,0,0,.18));opacity:0}
.arrow{position:fixed;top:50%;transform:translateY(-50%);z-index:20;width:65px;height:100px;border:0;background:none;color:#fff;font-size:75px;font-weight:200;cursor:pointer;text-shadow:0 3px 12px rgba(0,0,0,.6);transition:transform .2s,opacity .2s}
.arrow:hover{transform:translateY(-50%) scale(1.1)}
.arrow:disabled{opacity:.15;cursor:default}
#prev{left:12px}
#next{right:12px}
.hint{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.65);font:13px Georgia,serif;letter-spacing:1px;z-index:20;transition:opacity 1s}
@media(max-width:600px){
.book{width:91vw;height:84vh}
.arrow{width:42px;height:70px;font-size:55px}
#prev{left:0}
#next{right:0}
.hint{font-size:11px;bottom:12px}
}
</style>
</head>
<body>

<div class="book-area">
<div class="book" id="book">
<div class="page" id="current"><img id="currentImg"></div>
<div class="page" id="flip">
<div class="front"><img id="frontImg"></div>
<div class="back"><img id="backImg"></div>
</div>
<div class="flip-shadow" id="shadow"></div>
</div>
</div>

<button class="arrow" id="prev">‹</button>
<button class="arrow" id="next">›</button>
<div class="hint" id="hint">SWIPE OR TAP THE ARROWS</div>

<script>
const totalPages=10;
const path="assets/images/kavithai/";
const currentImg=document.getElementById("currentImg");
const frontImg=document.getElementById("frontImg");
const backImg=document.getElementById("backImg");
const flip=document.getElementById("flip");
const shadow=document.getElementById("shadow");
const next=document.getElementById("next");
const prev=document.getElementById("prev");
const hint=document.getElementById("hint");

let currentPage=1;
let animating=false;

function image(n){
return path+"kavithai"+n+".jpg";
}

function showPage(n){
currentPage=n;
currentImg.src=image(n);
prev.disabled=n===1;
next.disabled=n===totalPages;
}

function flipPage(direction){
if(animating)return;
if(direction==="next"&&currentPage>=totalPages)return;
if(direction==="prev"&&currentPage<=1)return;

animating=true;

const oldPage=currentPage;
const newPage=direction==="next"?oldPage+1:oldPage-1;

if(direction==="next"){
frontImg.src=image(oldPage);
backImg.src=image(newPage);
flip.style.transformOrigin="left center";
flip.style.display="block";
flip.style.transform="rotateY(0deg)";
shadow.style.opacity=".35";

const animation=flip.animate(
[
{transform:"rotateY(0deg)"},
{transform:"rotateY(-45deg)",offset:.35},
{transform:"rotateY(-115deg)",offset:.7},
{transform:"rotateY(-180deg)"}
],
{
duration:1250,
easing:"cubic-bezier(.45,.05,.2,1)",
fill:"forwards"
}
);

shadow.animate(
[
{opacity:".05"},
{opacity:".5",offset:.45},
{opacity:".2",offset:.8},
{opacity:"0"}
],
{duration:1250,easing:"ease-in-out",fill:"forwards"}
);

animation.onfinish=()=>{
showPage(newPage);
flip.style.display="none";
flip.style.transform="none";
shadow.style.opacity="0";
animating=false;
};
}else{
frontImg.src=image(oldPage);
backImg.src=image(newPage);
flip.style.transformOrigin="right center";
flip.style.display="block";
flip.style.transform="rotateY(-180deg)";
shadow.style.opacity=".35";

const animation=flip.animate(
[
{transform:"rotateY(-180deg)"},
{transform:"rotateY(-135deg)",offset:.35},
{transform:"rotateY(-65deg)",offset:.7},
{transform:"rotateY(0deg)"}
],
{
duration:1250,
easing:"cubic-bezier(.45,.05,.2,1)",
fill:"forwards"
}
);

shadow.animate(
[
{opacity:".05"},
{opacity:".5",offset:.45},
{opacity:".2",offset:.8},
{opacity:"0"}
],
{duration:1250,easing:"ease-in-out",fill:"forwards"}
);

animation.onfinish=()=>{
showPage(newPage);
flip.style.display="none";
flip.style.transform="none";
shadow.style.opacity="0";
animating=false;
};
}
}

next.addEventListener("click",()=>flipPage("next"));
prev.addEventListener("click",()=>flipPage("prev"));

let startX=0;
let startY=0;

document.addEventListener("touchstart",e=>{
startX=e.touches[0].clientX;
startY=e.touches[0].clientY;
},{passive:true});

document.addEventListener("touchend",e=>{
const endX=e.changedTouches[0].clientX;
const endY=e.changedTouches[0].clientY;
const dx=endX-startX;
const dy=endY-startY;

if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){
if(dx<0)flipPage("next");
else flipPage("prev");
}
},{passive:true});

document.addEventListener("keydown",e=>{
if(e.key==="ArrowRight")flipPage("next");
if(e.key==="ArrowLeft")flipPage("prev");
});

setTimeout(()=>hint.style.opacity="0",4000);

showPage(1);
</script>

</body>
</html>
