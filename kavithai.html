<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KAVITHAI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--pink:#d94f70;
--pink-light:#ffe1e9;
--wine:#6e1f3a;
--text:#4b2633;
--paper:#fffaf4;
--paper-dark:#eee3d8;
}

html,body{
width:100%;
min-height:100%;
}

body{
font-family:Georgia,"Times New Roman",serif;
background:
radial-gradient(circle at 20% 10%,rgba(255,255,255,.45),transparent 30%),
linear-gradient(145deg,#f8dfe5,#edc3cd 50%,#dba8b6);
color:var(--text);
overflow:hidden;
}

/* ---------- BACK BUTTON ---------- */

.back{
position:fixed;
top:22px;
left:25px;
z-index:1000;
padding:8px 15px;
border:1px solid rgba(110,31,58,.2);
border-radius:30px;
background:rgba(255,250,244,.55);
color:var(--wine);
text-decoration:none;
font-size:13px;
letter-spacing:1px;
backdrop-filter:blur(8px);
transition:.3s;
}

.back:hover{
background:rgba(255,250,244,.9);
transform:translateY(-2px);
}

/* ---------- TITLE ---------- */

.title{
position:fixed;
top:22px;
left:50%;
transform:translateX(-50%);
z-index:20;
font-size:12px;
letter-spacing:6px;
color:var(--wine);
opacity:.7;
}

/* ---------- BOOK AREA ---------- */

.book-area{
width:100vw;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
perspective:1800px;
}

/* ---------- BOOK ---------- */

.book{
position:relative;
width:min(900px,86vw);
height:min(620px,72vh);
display:flex;
transform-style:preserve-3d;
transition:transform .5s ease;
}

/* ---------- OPEN BOOK ---------- */

.book.open{
transform:rotateX(1deg);
}

/* ---------- PAGE AREA ---------- */

.book-pages{
position:absolute;
inset:0;
display:flex;
transform-style:preserve-3d;
}

/* ---------- STATIC LEFT PAGE ---------- */

.left-page,
.right-page{
position:absolute;
top:0;
height:100%;
width:50%;
overflow:hidden;
background:var(--paper);
box-shadow:0 4px 18px rgba(80,30,45,.18);
}

.left-page{
left:0;
border-radius:5px 0 0 5px;
transform-origin:right center;
}

.right-page{
right:0;
border-radius:0 5px 5px 0;
transform-origin:left center;
}

/* ---------- PAGE CANVAS ---------- */

.page-canvas{
width:100%;
height:100%;
display:block;
object-fit:contain;
background:var(--paper);
}

/* ---------- CENTER SPINE ---------- */

.spine{
position:absolute;
z-index:50;
top:0;
left:50%;
width:5px;
height:100%;
transform:translateX(-50%);
background:linear-gradient(
90deg,
rgba(70,25,40,.16),
rgba(255,255,255,.65),
rgba(70,25,40,.12)
);
box-shadow:
0 0 7px rgba(70,25,40,.15);
pointer-events:none;
}

/* ---------- FLIPPING PAGE ---------- */

.flip-page{
position:absolute;
top:0;
left:50%;
width:50%;
height:100%;
z-index:100;
transform-style:preserve-3d;
transform-origin:left center;
display:none;
}

.flip-page.active{
display:block;
}

.flip-front,
.flip-back{
position:absolute;
inset:0;
width:100%;
height:100%;
backface-visibility:hidden;
-webkit-backface-visibility:hidden;
overflow:hidden;
background:var(--paper);
box-shadow:0 5px 20px rgba(70,25,40,.2);
}

.flip-front{
border-radius:0 5px 5px 0;
}

.flip-back{
transform:rotateY(180deg);
border-radius:5px 0 0 5px;
}

/* ---------- FLIP ANIMATIONS ---------- */

.flip-next{
animation:flipNext .75s cubic-bezier(.55,.1,.25,1) forwards;
}

.flip-prev{
animation:flipPrev .75s cubic-bezier(.55,.1,.25,1) forwards;
}

@keyframes flipNext{
0%{
transform:rotateY(0deg);
}
100%{
transform:rotateY(-180deg);
}
}

@keyframes flipPrev{
0%{
transform:rotateY(-180deg);
}
100%{
transform:rotateY(0deg);
}
}

/* ---------- COVER ---------- */

.cover{
position:absolute;
inset:0;
z-index:200;
background:
radial-gradient(circle at 50% 30%,rgba(255,255,255,.12),transparent 35%),
linear-gradient(145deg,#7d2949,#5b1934);
border-radius:7px;
box-shadow:
8px 12px 35px rgba(70,20,40,.35),
inset 0 0 0 2px rgba(255,255,255,.08);
display:flex;
align-items:center;
justify-content:center;
transform-origin:left center;
transition:.8s cubic-bezier(.55,.1,.25,1);
backface-visibility:hidden;
}

.cover.open{
transform:rotateY(-165deg);
pointer-events:none;
}

.cover-inner{
width:82%;
height:82%;
border:1px solid rgba(255,235,240,.4);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
color:#fff8f5;
position:relative;
}

.cover-inner:before,
.cover-inner:after{
content:"";
position:absolute;
width:35px;
height:35px;
border-color:rgba(255,235,240,.55);
border-style:solid;
}

.cover-inner:before{
top:15px;
left:15px;
border-width:1px 0 0 1px;
}

.cover-inner:after{
right:15px;
bottom:15px;
border-width:0 1px 1px 0;
}

.cover-small{
font-size:10px;
letter-spacing:5px;
opacity:.75;
margin-bottom:28px;
}

.cover-title{
font-size:clamp(42px,7vw,75px);
letter-spacing:9px;
font-weight:normal;
}

.cover-line{
width:55px;
height:1px;
background:rgba(255,235,240,.6);
margin:25px 0;
}

.cover-sub{
font-size:12px;
letter-spacing:3px;
font-style:italic;
opacity:.8;
}

/* ---------- BACK COVER ---------- */

.back-cover{
position:absolute;
inset:0;
z-index:-1;
background:linear-gradient(145deg,#5b1934,#7d2949);
border-radius:7px;
box-shadow:8px 12px 35px rgba(70,20,40,.35);
}

/* ---------- CONTROLS ---------- */

.controls{
position:fixed;
bottom:25px;
left:50%;
transform:translateX(-50%);
z-index:500;
display:flex;
align-items:center;
gap:18px;
}

.nav-btn{
width:42px;
height:42px;
border:1px solid rgba(110,31,58,.25);
border-radius:50%;
background:rgba(255,250,244,.65);
color:var(--wine);
font-size:20px;
cursor:pointer;
backdrop-filter:blur(8px);
transition:.25s;
}

.nav-btn:hover{
background:#fffaf4;
transform:scale(1.08);
}

.nav-btn:disabled{
opacity:.35;
cursor:default;
transform:none;
}

.page-count{
font-size:12px;
letter-spacing:2px;
color:var(--wine);
min-width:70px;
text-align:center;
}

/* ---------- HINT ---------- */

.hint{
position:fixed;
bottom:80px;
left:50%;
transform:translateX(-50%);
font-size:11px;
letter-spacing:1.5px;
color:var(--wine);
opacity:.5;
white-space:nowrap;
transition:opacity 1s;
}

.hint.hide{
opacity:0;
}

/* ---------- LOADING ---------- */

.loading{
position:fixed;
inset:0;
z-index:2000;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
background:#f5d8df;
color:var(--wine);
transition:opacity .5s;
}

.loading.hidden{
opacity:0;
pointer-events:none;
}

.loader{
width:35px;
height:35px;
border:2px solid rgba(110,31,58,.15);
border-top-color:var(--wine);
border-radius:50%;
animation:spin .8s linear infinite;
margin-bottom:18px;
}

@keyframes spin{
to{transform:rotate(360deg)}
}

.loading-text{
font-size:11px;
letter-spacing:3px;
}

/* ---------- ERROR ---------- */

.error{
position:fixed;
inset:0;
z-index:3000;
display:none;
align-items:center;
justify-content:center;
text-align:center;
padding:30px;
background:#f5d8df;
color:var(--wine);
}

.error.show{
display:flex;
}

.error-box{
max-width:500px;
}

.error h2{
font-weight:normal;
font-size:28px;
margin-bottom:15px;
}

.error p{
font-family:Arial,sans-serif;
font-size:13px;
line-height:1.7;
opacity:.8;
}

/* ---------- MOBILE ---------- */

@media(max-width:700px){

.title{
top:17px;
font-size:9px;
letter-spacing:4px;
}

.back{
top:14px;
left:14px;
font-size:11px;
padding:7px 12px;
}

.book{
width:92vw;
height:65vw;
max-height:560px;
}

.cover-inner{
width:80%;
height:78%;
}

.cover-small{
font-size:7px;
letter-spacing:3px;
margin-bottom:18px;
}

.cover-title{
font-size:clamp(28px,10vw,55px);
letter-spacing:5px;
}

.cover-line{
margin:16px 0;
width:40px;
}

.cover-sub{
font-size:8px;
letter-spacing:2px;
}

.controls{
bottom:18px;
gap:12px;
}

.nav-btn{
width:38px;
height:38px;
font-size:17px;
}

.page-count{
font-size:10px;
min-width:60px;
}

.hint{
bottom:67px;
font-size:9px;
}

}

/* ---------- VERY SMALL PHONES ---------- */

@media(max-width:400px){

.book{
width:94vw;
height:68vw;
}

.cover-title{
font-size:27px;
letter-spacing:4px;
}

.cover-small{
margin-bottom:12px;
}

.cover-line{
margin:12px 0;
}

.cover-sub{
font-size:7px;
}

}
</style>
</head>

<body>

<!-- BACK TO MAIN PAGE -->
<a href="index.html" class="back">← HOME</a>

<div class="title">KAVITHAI</div>

<!-- LOADING -->
<div class="loading" id="loading">
<div class="loader"></div>
<div class="loading-text">OPENING YOUR BOOK...</div>
</div>

<!-- ERROR -->
<div class="error" id="error">
<div class="error-box">
<h2>Something went wrong ♡</h2>
<p id="errorText">
I couldn't open the kavithai book.<br>
Please make sure <b>kavithai.pdf</b> is in the correct folder.
</p>
</div>
</div>

<!-- BOOK -->
<div class="book-area">

<div class="book" id="book">

<!-- BACK COVER -->
<div class="back-cover"></div>

<!-- PDF PAGES -->
<div class="book-pages">

<div class="left-page">
<canvas class="page-canvas" id="leftCanvas"></canvas>
</div>

<div class="right-page">
<canvas class="page-canvas" id="rightCanvas"></canvas>
</div>

</div>

<!-- BOOK SPINE -->
<div class="spine"></div>

<!-- FRONT COVER -->
<div class="cover" id="cover">
<div class="cover-inner">

<div class="cover-small">A COLLECTION OF</div>

<div class="cover-title">KAVITHAI</div>

<div class="cover-line"></div>

<div class="cover-sub">written with a little love</div>

</div>
</div>

<!-- FLIPPING PAGE -->
<div class="flip-page" id="flipPage">

<div class="flip-front">
<canvas class="page-canvas" id="flipFront"></canvas>
</div>

<div class="flip-back">
<canvas class="page-canvas" id="flipBack"></canvas>
</div>

</div>

</div>
</div>

<!-- CONTROLS -->

<div class="controls">

<button class="nav-btn" id="prevBtn" aria-label="Previous page">
‹
</button>

<div class="page-count" id="pageCount">
COVER
</div>

<button class="nav-btn" id="nextBtn" aria-label="Next page">
›
</button>

</div>

<div class="hint" id="hint">
CLICK THE PAGE TO TURN IT
</div>

<!-- PDF.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>

/* =========================================================
   KAVITHAI BOOK
   ========================================================= */

/* CHANGE THIS ONLY IF YOUR PDF IS SOMEWHERE ELSE */
const PDF_PATH="assets/kavithai.pdf";


/* ---------- PDF.JS WORKER ---------- */

pdfjsLib.GlobalWorkerOptions.workerSrc=
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* ---------- VARIABLES ---------- */

let pdf=null;
let totalPages=0;
let currentSpread=0;
let isAnimating=false;
let coverOpen=false;


/*
   currentSpread:

   0 = cover

   1 = first open spread
   2 = second spread
   3 = third spread
   ...
*/


/* ---------- ELEMENTS ---------- */

const loading=document.getElementById("loading");
const error=document.getElementById("error");
const errorText=document.getElementById("errorText");

const cover=document.getElementById("cover");
const book=document.getElementById("book");

const leftCanvas=document.getElementById("leftCanvas");
const rightCanvas=document.getElementById("rightCanvas");

const flipPage=document.getElementById("flipPage");
const flipFront=document.getElementById("flipFront");
const flipBack=document.getElementById("flipBack");

const prevBtn=document.getElementById("prevBtn");
const nextBtn=document.getElementById("nextBtn");
const pageCount=document.getElementById("pageCount");
const hint=document.getElementById("hint");


/* ---------- LOAD PDF ---------- */

async function loadPDF(){

try{

pdf=await pdfjsLib.getDocument(PDF_PATH).promise;

totalPages=pdf.numPages;

if(totalPages===0){
throw new Error("The PDF contains no pages.");
}

loading.classList.add("hidden");

updateButtons();

}catch(err){

console.error(err);

loading.classList.add("hidden");

error.classList.add("show");

errorText.innerHTML=
"Please make sure <b>kavithai.pdf</b> exists.<br><br>"+
"Expected location:<br>"+
"<b>"+PDF_PATH+"</b>";

}

}


/* ---------- RENDER PDF PAGE ---------- */

async function renderPage(pageNumber,canvas){

if(!pageNumber || pageNumber<1 || pageNumber>totalPages){

const ctx=canvas.getContext("2d");

ctx.clearRect(0,0,canvas.width,canvas.height);

return;

}

const page=await pdf.getPage(pageNumber);

const parent=canvas.parentElement;

const width=parent.clientWidth;
const height=parent.clientHeight;

const viewport=page.getViewport({scale:1});

const scale=Math.min(
width/viewport.width,
height/viewport.height
);

const scaledViewport=page.getViewport({
scale:scale
});

const dpr=window.devicePixelRatio||1;

canvas.width=scaledViewport.width*dpr;
canvas.height=scaledViewport.height*dpr;

canvas.style.width=scaledViewport.width+"px";
canvas.style.height=scaledViewport.height+"px";

const ctx=canvas.getContext("2d");

ctx.setTransform(dpr,0,0,dpr,0,0);

await page.render({
canvasContext:ctx,
viewport:scaledViewport
}).promise;

}


/* ---------- CLEAR CANVAS ---------- */

function clearCanvas(canvas){

const ctx=canvas.getContext("2d");

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

}


/* ---------- OPEN BOOK ---------- */

async function openBook(){

if(coverOpen)return;

coverOpen=true;

cover.classList.add("open");

book.classList.add("open");

currentSpread=1;

await updateSpread();

updateButtons();

hint.classList.add("hide");

}


/* ---------- CLOSE BOOK ---------- */

async function closeBook(){

if(!coverOpen)return;

coverOpen=false;

cover.classList.remove("open");

currentSpread=0;

clearCanvas(leftCanvas);
clearCanvas(rightCanvas);

updateButtons();

}


/* ---------- UPDATE SPREAD ---------- */

async function updateSpread(){

if(!pdf)return;

let leftPageNumber;
let rightPageNumber;


/*
   Spread calculation.

   Spread 1:
   page 1 + page 2

   Spread 2:
   page 3 + page 4

   Spread 3:
   page 5 + page 6
*/

leftPageNumber=
(currentSpread-1)*2+1;

rightPageNumber=
leftPageNumber+1;


await Promise.all([

renderPage(leftPageNumber,leftCanvas),

renderPage(rightPageNumber,rightCanvas)

]);

updatePageCounter();

}


/* ---------- PAGE COUNTER ---------- */

function updatePageCounter(){

if(!coverOpen){

pageCount.textContent="COVER";

return;

}

let left=
(currentSpread-1)*2+1;

let right=left+1;

if(right<=totalPages){

pageCount.textContent=
left+" — "+right;

}else{

pageCount.textContent=
left+"";

}

}


/* ---------- NEXT ---------- */

async function nextPage(){

if(isAnimating)return;

if(!coverOpen){

await openBook();

return;

}


/*
   If we're already at the final spread,
   don't continue.
*/

const maxSpread=
Math.ceil(totalPages/2);

if(currentSpread>=maxSpread)return;

isAnimating=true;


/* Determine pages */

const oldRight=
currentSpread*2;

const newLeft=
oldRight+1;

const newRight=
newLeft+1;


/*
   The page on the right turns
   to become the left page.
*/

await renderPage(
oldRight,
flipFront
);

await renderPage(
newLeft,
flipBack
);


/* Show flipping page */

flipPage.className=
"flip-page active flip-next";


/*
   Wait for animation
*/

await new Promise(resolve=>{
setTimeout(resolve,760);
});


/*
   Advance spread
*/

currentSpread++;

flipPage.className="flip-page";

await updateSpread();

isAnimating=false;

updateButtons();

}


/* ---------- PREVIOUS ---------- */

async function prevPage(){

if(isAnimating)return;


/*
   If we're on the first spread,
   return to the cover.
*/

if(!coverOpen)return;

if(currentSpread===1){

await closeBook();

return;

}

isAnimating=true;


/*
   Current left page turns back.
*/

const currentLeft=
(currentSpread-1)*2+1;

const previousRight=
currentLeft-1;

await renderPage(
currentLeft,
flipFront
);

await renderPage(
previousRight,
flipBack
);


flipPage.className=
"flip-page active flip-prev";


await new Promise(resolve=>{
setTimeout(resolve,760);
});


currentSpread--;

flipPage.className="flip-page";

await updateSpread();

isAnimating=false;

updateButtons();

}


/* ---------- BUTTON STATES ---------- */

function updateButtons(){

if(!coverOpen){

prevBtn.disabled=true;
nextBtn.disabled=false;

return;

}

prevBtn.disabled=
currentSpread<=1;

nextBtn.disabled=
currentSpread>=Math.ceil(totalPages/2);

}


/* ---------- BUTTON EVENTS ---------- */

nextBtn.addEventListener(
"click",
nextPage
);

prevBtn.addEventListener(
"click",
prevPage
);


/* ---------- CLICK BOOK ---------- */

book.addEventListener("click",function(e){

/*
   Don't trigger when clicking cover controls
*/

if(!coverOpen){

openBook();

return;

}

if(isAnimating)return;


/*
   Ignore clicks outside the actual pages.
*/

const rect=book.getBoundingClientRect();

const x=e.clientX-rect.left;

if(x>rect.width/2){

nextPage();

}else{

prevPage();

}

});


/* ---------- KEYBOARD ---------- */

document.addEventListener(
"keydown",
function(e){

if(e.key==="ArrowRight"){

nextPage();

}

if(e.key==="ArrowLeft"){

prevPage();

}

if(e.key==="Escape"){

closeBook();

}

}
);


/* ---------- SWIPE SUPPORT ---------- */

let touchStartX=0;
let touchEndX=0;

book.addEventListener(
"touchstart",
function(e){

touchStartX=e.changedTouches[0].screenX;

},
{passive:true}
);


book.addEventListener(
"touchend",
function(e){

touchEndX=e.changedTouches[0].screenX;

handleSwipe();

},
{passive:true}
);


function handleSwipe(){

const difference=
touchEndX-touchStartX;

if(Math.abs(difference)<40)return;

if(difference<0){

nextPage();

}else{

prevPage();

}

}


/* ---------- RESIZE ---------- */

let resizeTimer;

window.addEventListener(
"resize",
function(){

clearTimeout(resizeTimer);

resizeTimer=setTimeout(
async function(){

if(pdf&&coverOpen){

await updateSpread();

}

},
200
);

});


/* ---------- START ---------- */

loadPDF();

</script>

</body>
</html>
